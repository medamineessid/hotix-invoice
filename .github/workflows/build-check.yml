name: Build Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translation-key integrity check
        run: python scripts/check_translations.py
      - run: dotnet build client/Hotix.InvoiceClient.csproj
      - name: Run C# tests
        run: dotnet test client-tests/Hotix.InvoiceClient.Tests.csproj
      - name: Install Python test dependencies
        run: pip install -r requirements.txt pytest
      # PaddleOCR/PaddlePaddle are intentionally installed from requirements.txt.
      # They are heavyweight, but CI must exercise the same runtime dependency
      # set shipped by the application instead of silently omitting OCR coverage.
      - name: Run Python tests
        run: pytest server/tests/
